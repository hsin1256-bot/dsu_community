name: Sync DSU data

# 학교 사이트 → Supabase 동기화 (배포된 앱의 /api/sync 호출)
# 필요한 저장소 Secrets:
#   SYNC_BASE_URL  예) https://dsu-community.vercel.app
#   CRON_SECRET    Vercel 환경 변수 CRON_SECRET 과 같은 값
on:
  schedule:
    - cron: '0 0-9 * * 1-5'   # 평일 KST 09:00~18:00 매시 정각: 공지
    - cron: '30 18 * * *'     # 매일 KST 03:30: 학사일정
  workflow_dispatch:
    inputs:
      job:
        description: 'all | notices | schedules'
        default: all

concurrency:
  group: dsu-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Choose job
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "job=${{ github.event.inputs.job }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 18 * * *" ]; then
            echo "job=schedules" >> "$GITHUB_OUTPUT"
          else
            echo "job=notices" >> "$GITHUB_OUTPUT"
          fi
      - name: Call /api/sync
        env:
          SYNC_BASE_URL: ${{ secrets.SYNC_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SYNC_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::SYNC_BASE_URL / CRON_SECRET secret 이 설정되지 않아 건너뜁니다."
            exit 0
          fi
          status=$(curl -sS -o body.json -w '%{http_code}' --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SYNC_BASE_URL/api/sync?job=${{ steps.pick.outputs.job }}")
          cat body.json
          echo
          if [ "$status" != "200" ]; then
            echo "::error::동기화 응답 HTTP $status (일부 실패 시 207)"
            exit 1
          fi
